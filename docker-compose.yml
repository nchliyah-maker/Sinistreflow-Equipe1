# Stack de dev SinistreFlow (Thomas - "ça marche chez moi")
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sinistreflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant - copier .env.example vers .env}
      POSTGRES_DB: sinistreflow
    # lié à 127.0.0.1 : la base n'est pas joignable depuis l'extérieur
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinistreflow -d sinistreflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # joue les migrations puis s'arrête ; l'application démarre ensuite
  migrate:
    # sur la VM, deploy.sh fixe SINISTREFLOW_IMAGE sur l'image publiée par la CI
    image: ${SINISTREFLOW_IMAGE:-sinistreflow:local}
    build: .
    command: ["node", "src/db/migrate.js"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${SINISTREFLOW_IMAGE:-sinistreflow:local}
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      # dans un conteneur, localhost désigne le conteneur lui-même
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
