# Stack de dev SinistreFlow (Thomas - "ça marche chez moi")
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sinistreflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant - copier .env.example vers .env}
      POSTGRES_DB: sinistreflow
    # Lié à 127.0.0.1 : la base reste utilisable depuis le poste (tests, psql)
    # mais n'est plus joignable depuis l'extérieur de la machine.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinistreflow -d sinistreflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Joue les migrations en attente puis s'arrête (code 0 si tout va bien).
  # L'application ne démarre qu'après : plus besoin de "penser à" lancer npm run migrate.
  migrate:
    build: .
    command: ["node", "src/db/migrate.js"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      # Dans un conteneur, localhost désigne le conteneur lui-même :
      # la base se joint par le nom de son service.
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # relancé par Docker s'il s'arrête (panne, redémarrage de la machine)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
