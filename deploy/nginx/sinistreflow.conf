# Reverse proxy de SinistreFlow : seul point d'entrée public de la VM.
# Installé dans /etc/nginx/sites-available/ par deploy/install-host.sh.
# L'application et Grafana n'écoutent que sur 127.0.0.1 : on ne les atteint que par nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ne pas annoncer la version de nginx
    server_tokens off;

    client_max_body_size 1m;

    # Les métriques sont réservées à Prometheus, qui les lit par le réseau Docker.
    location = /metrics {
        return 403;
    }

    # Grafana, servi sous /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH=true)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # flux temps réel de Grafana
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # L'application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
